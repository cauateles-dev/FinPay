<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>FinPay</title>

    <!-- Meta Tags for PWA & iOS Support -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinPay" />

    <!-- Favicons and Manifest Linkage -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#FDFDFD]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Async Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        // Se estivermos em desenvolvimento ou de teste no preview do AI Studio, vamos desregistrar o SW e limpar o cache para atualizar instantaneamente!
        const isDevelopment = window.location.hostname.includes('localhost') || 
                              window.location.hostname.includes('run.app') ||
                              window.location.hostname.includes('gitpod');

        if (isDevelopment) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
              console.log('SW desativado temporariamente em ambiente de desenvolvimento.');
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (let name of names) {
                caches.delete(name);
              }
              console.log('Cache limpo para atualização em tempo real.');
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('PWA Service Worker registrado com sucesso:', registration.scope);
              })
              .catch((error) => {
                console.error('Falha ao registrar PWA Service Worker:', error);
              });
          });
        }
      }
    </script>
  </body>
</html>
